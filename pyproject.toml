[project]
name = "L00P"
version = "0.1.0"
description = "Silly math game"
readme = "README.md"
authors = [
    { name = "blade-of-miquella", email = "melinaprogg@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
L00P = "L00P:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
